# Todo lo que se puede comprobar sin placa, en una maquina que no es la
# del autor: el modelo y los estimadores, los bancos VHDL con GHDL, la
# sintesis a celdas estandar, los dos firmwares contra el motor simulado
# con mbedtls real, la compilacion con ESP-IDF, y la memoria en PDF.
# Cada trabajo es independiente; ninguno necesita credenciales.
name: verifica

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:

  modelo:
    name: modelo, estimadores y verificador del PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy cryptography
      - name: modelo estocastico del anillo (24 comprobaciones)
        run: python analysis/ero_model.py
      - name: estimador de jitter (20 comprobaciones)
        run: python analysis/jitter_estimator.py
      - name: CTR_DRBG de referencia contra 960 vectores CAVP
        run: python analysis/ctr_drbg_ref.py
      - name: cortes de los tests de salud (SP 800-90B 4.4)
        run: python analysis/cortes_salud.py
      - name: verificador de lecturas firmadas, robustez (fuzz)
        run: python analysis/fuzz_verifica_lecturas.py
      # El log del banco en host lleva a proposito una firma invalida y una
      # lectura repetida; lo comprueba run_host.py contra su linea esperada
      # (trabajo "host"). Aqui, el log de la placa, que debe salir limpio.
      - name: lecturas firmadas de la placa (log versionado)
        run: python analysis/verifica_lecturas.py results/placa_medidor_esp32c3.log

  rtl:
    name: bancos VHDL (GHDL) y verificacion cruzada
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: ghdl --version
      - name: siete bancos, con las propiedades PSL
        run: python rtl/run_tb.py
      - name: CMAC del banco del motor recalculado en Python
        run: python analysis/verifica_top.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: psl
          path: rtl/build/*_psl.json

  sintesis:
    name: sintesis a celdas estandar (IHP SG13G2)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ghdl
      - run: pip install yowasp-yosys
      - name: todos los bloques, area en kGE
        run: python synth/sintetiza.py --verilog
      - uses: actions/upload-artifact@v4
        with:
          name: sintesis
          path: |
            results/sintesis_sg13g2.csv
            synth/build/*.log

  host:
    name: firmwares en el PC contra el motor simulado (mbedtls real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: mbedtls 3.6 (la rama LTS que lleva ESP-IDF 5.3)
        run: git clone --depth 1 --branch mbedtls-3.6 --recurse-submodules --shallow-submodules https://github.com/Mbed-TLS/mbedtls.git /tmp/mbedtls
      - name: banco en host
        run: python firmware/host_check/run_host.py --mbedtls /tmp/mbedtls
      - name: banco en host con ASan y UBSan
        run: python firmware/host_check/run_host.py --mbedtls /tmp/mbedtls --sanear

  firmware:
    name: compilacion con ESP-IDF 5.3
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    strategy:
      matrix:
        include:
          - proyecto: verificador
            objetivo: esp32
          - proyecto: medidor
            objetivo: esp32c3
    steps:
      - uses: actions/checkout@v4
      - name: ${{ matrix.proyecto }} para ${{ matrix.objetivo }}
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/${{ matrix.proyecto }}
          idf.py set-target ${{ matrix.objetivo }}
          idf.py build
          idf.py size
      - name: ${{ matrix.proyecto }} con el motor simulado (QEMU / placa sin motor)
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd firmware/${{ matrix.proyecto }}
          idf.py -B build_sim -DMOTOR_SIMULADO=1 build

  memoria:
    name: memoria en PDF (tectonic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: wtfjoke/setup-tectonic@v3
      - name: version en ingles
        working-directory: memoria
        run: tectonic tfm_main.tex
      - name: version en espanol
        working-directory: memoria
        run: tectonic tfm_main_es.tex
      - uses: actions/upload-artifact@v4
        with:
          name: memoria
          path: |
            memoria/tfm_main.pdf
            memoria/tfm_main_es.pdf
